<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 항공편 통합 검색</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="mode-switch-container">
    <a href="/flights/search" class="mode-switch-btn">일반 MVC 검색으로 전환</a>
</div>
<div class="chat-container">
    <div class="header">
        <h2>AI 항공 검색</h2>
        <select id="apiType">
            <optgroup label="1. 중앙 통제 (Orchestrator) 방식">
                <option value="orch-ollama">Orchestrator (Ollama)</option>
                <option value="orch-gemini">Orchestrator (Gemini)</option>
            </optgroup>

            <optgroup label="2. 에이전트 협업 (Coordinator) 방식">
                <option value="a2a-ollama">Coordinator (Ollama)</option>
                <option value="a2a-gemini">Coordinator (Gemini)</option>
            </optgroup>

            <optgroup label="3. 자율 도구 호출 (LLM Tool) 방식">
                <option value="tool-ollama">Tool Call (Ollama)</option>
                <option value="tool-gemini">Tool Call (Gemini)</option>
            </optgroup>
        </select>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">안녕하세요! 원하시는 출발지, 도착지, 날짜를 편하게 말씀해 주세요. <br>(예: 내일 광주에서 제주가는 비행기 찾아줘)</div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()" id="sendBtn">전송</button>
    </div>
</div>

<script src="/js/index.js"></script>

</body>
</html>
