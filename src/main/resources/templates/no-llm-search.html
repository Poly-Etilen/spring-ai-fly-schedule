<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일반 항공편 검색 (Pure MVC)</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/no-llm-search.css">
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>일반 항공편 직접 검색</h2>
        <a href="/" class="mode-switch-btn">AI 자연어 검색으로 전환 </a>
    </div>

    <form id="searchForm" class="search-form" onsubmit="performSearch(event)">
        <div class="form-group">
            <label for="departureAirport">출발 공항 *</label>
            <select id="departureAirport" required>
                <option value="광주">광주</option>
                <option value="김포">김포</option>
                <option value="제주">제주</option>
                <option value="김해">김해/부산</option>
                <option value="인천">인천</option>
                <option value="청주">청주</option>
                <option value="대구">대구</option>
            </select>
        </div>
        <div class="form-group">
            <label for="arrivalAirport">도착 공항 *</label>
            <select id="arrivalAirport" required>
                <option value="제주" selected>제주</option>
                <option value="김포">김포</option>
                <option value="광주">광주</option>
                <option value="김해">김해/부산</option>
                <option value="인천">인천</option>
                <option value="청주">청주</option>
                <option value="대구">대구</option>
            </select>
        </div>
        <div class="form-group">
            <label for="date">출발 날짜 *</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="afterTime">기준 시간 (이후)</label>
            <input type="time" id="afterTime">
        </div>
        <div class="form-group">
            <label for="minPrice">최소 가격 (원)</label>
            <input type="number" id="minPrice" placeholder="예: 30000">
        </div>
        <div class="form-group">
            <label for="maxPrice">최대 가격 (원)</label>
            <input type="number" id="maxPrice" placeholder="예: 80000">
        </div>

        <button type="submit" class="btn-submit">항공편 검색하기</button>
    </form>

    <div class="results-section">
        <h3>검색 결과</h3>
        <div id="loading" class="loading">공공데이터 API 조회 중... ⏳</div>
        <table id="resultsTable">
            <thead>
            <tr>
                <th>항공편명</th>
                <th>항공사</th>
                <th>출발 시간</th>
                <th>도착 시간</th>
                <th>일반석 요금</th>
            </tr>
            </thead>
            <tbody id="resultsBody">
            <tr>
                <td colspan="5" class="no-data">검색 조건 입력 후 버튼을 눌러주세요.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="info-panels">
        <div class="info-card">
            <div class="info-header">🏢 공항 정보</div>
            <div class="info-actions">
                <button type="button" class="btn-outline" onclick="fetchAirports()">📇 전체 공항 목록</button>
                <button type="button" class="btn-outline" onclick="searchAirportCode()">🔍 공항 코드 조회</button>
            </div>
            <input type="text" id="airportLookupInput" class="info-input" placeholder="광주">
            <div id="airportResultBox" class="info-result-box"></div>
        </div>

        <div class="info-card">
            <div class="info-header">✈️ 항공사 정보</div>
            <div class="info-actions">
                <button type="button" class="btn-outline" onclick="fetchAirlines()">📇 전체 항공사 목록</button>
                <button type="button" class="btn-outline" onclick="searchAirlineCode()">🔍 항공사 ID 조회</button>
            </div>
            <input type="text" id="airlineLookupInput" class="info-input" placeholder="항공사 이름 (ID 조회용, 예: 아시아나항공, 대한항공)">
            <div id="airlineResultBox" class="info-result-box"></div>
        </div>
    </div>
</div>

<script src="/js/no-llm-search.js"></script>

</body>
</html>
