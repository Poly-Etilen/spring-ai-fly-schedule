version: '3.8'

services:
  flyschedule:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s